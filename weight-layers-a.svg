  <script><![CDATA[
    (() => {
      const layers = Array.from(document.querySelectorAll('svg > g'));
      const names = ['1000 Black','900 Heavy','800 Extrabold','700 Bold','600 Semibold','500 Medium','400 Regular','300 Light','200 Extralight','100 Thin'];
      const root = document.documentElement;
      const parentStage = window.parent.document.querySelector('.weight-system-glyph');
      const parentLabel = window.parent.document.querySelector('.weight-layer-label');
      root.style.cursor = 'crosshair';
      root.addEventListener('pointermove', event => {
        const progress = Math.min(.999, Math.max(0, event.clientX / root.getBoundingClientRect().width));
        const active = Math.min(layers.length - 1, Math.floor(progress * layers.length));
        layers.forEach((layer, index) => {
          layer.style.opacity = index === active ? '.5' : '.055';
          layer.style.filter = 'none';
        });
        parentStage?.classList.add('is-playing');
        if (parentLabel) parentLabel.textContent = names[active];
      });
      root.addEventListener('pointerleave', () => {
        layers.forEach(layer => {
          layer.style.opacity = '';
          layer.style.filter = '';
        });
        parentStage?.classList.remove('is-playing');
        if (parentLabel) parentLabel.textContent = 'Move to explore';
      });
    })();
  ]]></script>
</svg>
